name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions: read-all

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }} / Django ${{ matrix.django-version }}
    runs-on: ubuntu-latest
    
    env:
      DJANGO_DEBUG: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python-version: '3.11', django-version: '5.2'}
          - {python-version: '3.12', django-version: '5.2'}
          - {python-version: '3.13', django-version: '5.2'}
          - {python-version: '3.14', django-version: '5.2'}
          - {python-version: '3.12', django-version: '6.0'}
          - {python-version: '3.13', django-version: '6.1'}
          - {python-version: '3.14', django-version: '6.1'}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e '.[dev,qr,markdown,pdf,excel]' 'Django==${{ matrix.django-version }}.*'
    - name: Install PDF system libraries
      run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
    
    - name: Run migrations check
      run: |
        cd example_project
        python manage.py makemigrations --check --dry-run
    
    - name: Check for missing migrations
      run: |
        cd example_project
        python manage.py migrate
    
    - name: Run Django checks
      run: |
        cd example_project
        python manage.py check

    - name: Run test suite
      run: |
        python -m pytest tests/ -v --tb=short
  
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff

    - name: Check code formatting with Ruff
      run: |
        ruff format --check django_forms_workflows/ tests/

    - name: Lint with Ruff
      run: |
        ruff check django_forms_workflows/ tests/
  
  build:
    name: Build Package
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine wheel setuptools
    
    - name: Build distribution packages
      run: |
        python -m build
    
    - name: Check distribution packages
      run: |
        twine check dist/*
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-packages
        path: dist/


  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=moderate

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pip-audit poetry
      - run: poetry check --lock
      - name: Audit all locked Python dependencies, including extras and tooling
        run: python scripts/audit_lock.py
